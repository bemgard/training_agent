name: Nightly Garmin Sync

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC varje natt
  workflow_dispatch:       # möjliggör manuell trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python3 scripts/sync_garmin.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/training.db
          git diff --staged --quiet || git commit -m "Auto sync $(date '+%Y-%m-%d')"
          git push