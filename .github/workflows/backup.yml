name: Databasbackup

# Söndag och onsdag 03:17 UTC. Två körningar i veckan håller också Supabase
# gratisprojekt vaket (pausas efter 7 dagar utan aktivitet).
on:
  schedule:
    - cron: '17 3 * * 0,3'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:17   # pg_dump måste matcha Supabase Postgres 17
    steps:
      - name: pg_dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "Secret SUPABASE_DB_URL saknas"; exit 1; }
          mkdir -p backup
          pg_dump "$DATABASE_URL" --schema=public --no-owner --no-privileges -Fc \
            -f "backup/training-agent-$(date +%F).dump"
          ls -lh backup

      - uses: actions/upload-artifact@v4
        with:
          name: databasbackup-${{ github.run_number }}
          path: backup/
          retention-days: 90
